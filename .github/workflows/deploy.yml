name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (non-blocking)
        run: bun audit || true

      - name: Build
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          test -f .docu/dist/docs/index.html
          test -d .docu/dist/docs/assets
          rm -rf .pages
          mkdir -p .pages
          cp -R .docu/dist/docs/. .pages/
          cp .docu/dist/404.html .pages/404.html
          cp .docu/dist/.nojekyll .pages/.nojekyll
          cp .docu/dist/_headers .pages/_headers
          test -f .pages/index.html
          test -d .pages/assets
          echo "pages: $(find .pages -name '*.html' | wc -l)"

      - name: Fail on localhost leaks
        run: |
          if grep -rq "localhost:3000" .pages; then
            echo "::error::Build output still references localhost — check meta.baseURL"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
