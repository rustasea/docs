name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (non-blocking)
        run: bun audit || true

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f .docu/dist/index.html
          test -f .docu/dist/docs/index.html
          test -d .docu/dist/assets
          test -n "$(find .docu/dist/assets -maxdepth 1 -name '*.css' -print -quit)"
          test -n "$(find .docu/dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          echo "pages: $(find .docu/dist -name '*.html' | wc -l)"

      - name: Fail on localhost leaks
        run: |
          if grep -rq "localhost:3000" .docu/dist; then
            echo "::error::Build output still references localhost — check meta.baseURL"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .docu/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
